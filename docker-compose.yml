services:
  api:
    build: .
    container_name: ragx-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=postgres
      - QDRANT_HOST=qdrant
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - HF_HOME=/app/hf_cache
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - hf_cache:/app/hf_cache
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./reports:/app/reports
    networks:
      - ragx-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ragx-dashboard
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env.example
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - ragx-network

  postgres:
    image: postgres:16-alpine
    container_name: ragx-postgres
    environment:
      - POSTGRES_USER=ragx
      - POSTGRES_PASSWORD=change_me
      - POSTGRES_DB=ragx
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragx -d ragx"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ragx-network

  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: ragx-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ragx-network

  redis:
    image: redis:7-alpine
    container_name: ragx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ragx-network

  neo4j:
    image: neo4j:5.18-community
    container_name: ragx-neo4j
    environment:
      - NEO4J_AUTH=neo4j/change_me
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ragx-network

networks:
  ragx-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  neo4j_data:
  hf_cache:
