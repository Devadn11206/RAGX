name: RAGX CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    env:
      APP_ENV: testing
      API_HOST: 0.0.0.0
      API_PORT: 8000
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: ragx
      POSTGRES_USER: ragx
      POSTGRES_PASSWORD: change_me
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
      QDRANT_URL: http://localhost:6333
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: change_me
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio ruff httpx

    - name: Start Infrastructure (Docker Compose)
      run: |
        docker compose up -d postgres qdrant redis neo4j
        # Wait for services to be healthy
        sleep 15
        
    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Run Core Tests (pytest)
      run: |
        pytest -q
        
    - name: Run Security Tests
      run: |
        python -m scripts.security_test
        
    - name: Run Semantic Golden Tests
      run: |
        python -m scripts.semantic_golden_test

    - name: Test API Docker Build
      run: |
        docker build -t ragx-api:latest -f Dockerfile .
        
    - name: Test Dashboard Docker Build
      run: |
        docker build -t ragx-dashboard:latest -f Dockerfile.dashboard .

    - name: Shutdown Infrastructure
      if: always()
      run: docker compose down -v
